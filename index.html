<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Buddy & Symbol Editor · Standalone Block Editor</title>
  <link rel="stylesheet" href="./css/theme.css">
  <style>
    .block-editor-container {
      display: grid;
      grid-template-rows: auto 1fr 240px;
      height: calc(100vh - 40px);
      overflow: hidden;
    }

    .top-properties-bar {
      background: var(--osc-bg-surface);
      border-bottom: 1px solid var(--osc-border-default);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .form-group-inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group-inline label {
      font-size: 11px;
      font-weight: 600;
      color: var(--osc-text-muted);
      text-transform: uppercase;
    }

    .canvas-stage {
      background: radial-gradient(circle at 50% 50%, #151F38 0%, #080C16 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: auto;
    }

    .canvas-stage svg {
      max-width: 90%;
      max-height: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    .data-grid-panel {
      background: var(--osc-bg-surface);
      border-top: 1px solid var(--osc-border-default);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .data-grid-header {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--osc-border-default);
      background: var(--osc-bg-surface-hover);
    }

    .data-table-container {
      flex: 1;
      overflow: auto;
    }

    table.pin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    table.pin-table th {
      position: sticky;
      top: 0;
      background: var(--osc-bg-input);
      color: var(--osc-text-muted);
      padding: 6px 8px;
      text-align: left;
      border-bottom: 1px solid var(--osc-border-default);
      font-weight: 600;
      z-index: 2;
    }

    table.pin-table td {
      padding: 2px 4px;
      border-bottom: 1px solid var(--osc-border-default);
    }

    .cell-input {
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      color: var(--osc-text-primary);
      padding: 4px 6px;
      font-size: 11px;
      border-radius: 2px;
      font-family: inherit;
    }

    .cell-input:focus {
      background: var(--osc-bg-input);
      border-color: var(--osc-accent-primary);
      outline: none;
    }

    .text-center {
      text-align: center;
    }

    .col-idx {
      width: 45px;
    }

    .col-actions {
      width: 45px;
      text-align: center;
    }
  </style>
</head>
<body class="theme-deep-horizon">
  <header class="app-window-header">
    <div class="window-title-group">
      <span class="window-dot"></span>
      <span class="window-title">Block Buddy & Schematic Symbol Editor</span>
      <span class="window-pill" id="block-tag">STANDALONE BLOCK EDITOR</span>
    </div>
    <div class="window-actions">
      <button class="btn btn-secondary" id="btn-sync-discovered" title="Load live block from Discovered Project">
        <span class="btn-icon">⚡</span> Discovered
      </button>
      <button class="btn btn-secondary" id="btn-open" title="Open block JSON">
        <span class="btn-icon">📂</span> Open
      </button>
      <button class="btn btn-primary" id="btn-save" title="Save & Return modified block to caller">
        <span class="btn-icon">💾</span> Save & Return
      </button>
      <button class="btn btn-icon" id="btn-close" title="Close Editor">✕</button>
    </div>
  </header>

  <div class="block-editor-container">
    <div class="top-properties-bar">
      <div class="form-group-inline">
        <label for="input-block-name">Symbol Name:</label>
        <input type="text" id="input-block-name" class="input" style="width:180px;" value="DSP_CORE">
      </div>
      <div class="form-group-inline">
        <label for="input-block-kind">Kind / Type:</label>
        <input type="text" id="input-block-kind" class="input" style="width:160px;" value="audio.dsp">
      </div>
      <div class="form-group-inline">
        <label for="input-block-w">W:</label>
        <input type="number" id="input-block-w" class="input" style="width:70px;" value="240">
      </div>
      <div class="form-group-inline">
        <label for="input-block-h">H:</label>
        <input type="number" id="input-block-h" class="input" style="width:70px;" value="160">
      </div>
    </div>

    <main class="canvas-stage">
      <div id="symbol-preview-stage"></div>
    </main>

    <section class="data-grid-panel">
      <div class="data-grid-header">
        <span style="font-size:11px; font-weight:600; text-transform:uppercase; color:var(--osc-text-muted);">
          Pin Terminals & Port Connectors (Live Editable)
        </span>
        <button class="btn btn-primary btn-sm" id="btn-add-pin">+ Add Pin Terminal</button>
      </div>
      <div class="data-table-container">
        <table class="pin-table">
          <thead>
            <tr>
              <th class="col-idx text-center">#</th>
              <th>Pin Identifier / Label</th>
              <th style="width:120px;">Chassis Side</th>
              <th style="width:120px;">Direction</th>
              <th>Signal Format</th>
              <th class="col-actions">Act</th>
            </tr>
          </thead>
          <tbody id="pin-table-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script type="module" src="./js/blockBuddyApp.js"></script>
</body>
</html>
