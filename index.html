<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Buddy & Symbol Editor — APK.audio</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f1218; color: #e2e8f0; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #283348; padding-bottom: 12px; margin-bottom: 20px; }
    .layout { display: flex; gap: 24px; }
    .preview { flex: 1; height: 380px; background: #171d27; border: 1px solid #2d384e; border-radius: 8px; display: flex; justify-content: center; align-items: center; position: relative; }
    .block-box { width: 220px; height: 140px; background: #222938; border: 2px solid #38bdf8; border-radius: 6px; position: relative; display: flex; justify-content: center; align-items: center; }
    .port-pin { position: absolute; width: 10px; height: 10px; background: #38bdf8; border-radius: 2px; }
    .sidebar { width: 320px; background: #171d27; border: 1px solid #283348; border-radius: 8px; padding: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid #222c3d; }
    button { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:20px;">📦</span>
      <h2>Block Buddy & Symbol Editor</h2>
    </div>
    <button id="btn-export">Export Symbol JSON</button>
  </header>

  <div class="layout">
    <div class="preview">
      <div class="block-box">
        <div style="font-weight:700; color:#fff;" id="block-name">FLOW_PROCESS</div>
        <!-- Pins -->
        <div class="port-pin" style="left:-6px; top:50%; transform:translateY(-50%); background:#34d399;" title="INPUT"></div>
        <div class="port-pin" style="right:-6px; top:50%; transform:translateY(-50%); background:#38bdf8;" title="OUTPUT"></div>
        <div class="port-pin" style="top:-6px; left:50%; transform:translateX(-50%); background:#fbbf24;" title="CONTROL"></div>
        <div class="port-pin" style="bottom:-6px; left:50%; transform:translateX(-50%); background:#ef4444;" title="POWER"></div>
      </div>
    </div>

    <div class="sidebar">
      <h3 style="font-size:14px; text-transform:uppercase; color:#94a3b8;">Terminal Ports</h3>
      <table>
        <thead>
          <tr><th>Pin</th><th>Side</th><th>Signal</th></tr>
        </thead>
        <tbody id="port-rows"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { BlockDefinitionModel } from './js/blockApp.js';
    const model = new BlockDefinitionModel('flow.process', 'FLOW_PROCESS');

    const tbody = document.getElementById('port-rows');
    model.ports.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><b>${p.id}</b></td><td>${p.side}</td><td>${p.format}</td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(model, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${model.name}.json`;
      a.click();
    });
  </script>
</body>
</html>
